# ------------------------------| DOCKER COMPOSE |

# ----------| Services |
services:

# ----------| NGINX |
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    depends_on:
      - wordpress
    restart: always
    env_file:
      - ../.env

# ----------| WordPress + PHP-FPM |
  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    depends_on:
      - mariadb
    restart: on-failure
    env_file:
      - ../.env

# ----------| MariaDB |
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    restart: always
    env_file:
      - ../.env

# ----------| Volumes (data percistence) |
volumes:
  wordpress_data:
    driver_opts:
      type: none
      device: ${HOME}/data/wordpress
      o: bind
  mariadb_data:
    driver_opts:
      type: none
      device: ${HOME}/data/mariadb
      o: bind

# ----------| Internal network |
networks:
  inception_network:
    name: inception_network
    driver: bridge