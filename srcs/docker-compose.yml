# ------------------------------| DOCKER COMPOSE |

# ----------| Docker compose version |
version: '3.8'

# ----------| Definition of environment variables                          |
# ----------| Docker compose will read the ".env" file on project rool dir |

# ----------| Services (containers) |
services:

# ----------| NGINX |
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception_network
    depends_on:
      - wordpress
    restart: unless-stopped
    env_file:
      - ../.env

# ----------| WordPress + PHP-FPM |
  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception_network
    depends_on:
      - mariadb
    restart: unless-stopped
    env_file:
      - ../.env

# ----------| MariaDB |
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    restart: unless-stopped
    env_file:
      - ../.env

# ----------| Volumes (data percistence) |
volumes:
  wordpress_files:
    name: wordpress_files
    driver: local
    driver_opts:
      type: none
      device: /home/${USER}/data/wordpress
      o: bind
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      device: /home/${USER}/data/mariadb
      o: bind

# ----------| Internal network |
networks:
  inception_network:
    name: inception_network
    driver: bridge